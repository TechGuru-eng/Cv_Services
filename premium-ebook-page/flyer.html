<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyer Premium - HireMe</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding: 20px;
        }
        
        /* Format 1080x1350 for Instagram/Facebook */
        .flyer {
            width: 1080px;
            height: 1350px;
            background: linear-gradient(145deg, #070B14 0%, #111827 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(212, 175, 55, 0.1);
        }

        /* Ambient Glows */
        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(150px);
            z-index: 0;
        }
        .glow-1 {
            width: 800px;
            height: 800px;
            background: rgba(212, 175, 55, 0.15);
            top: -200px;
            left: -200px;
        }
        .glow-2 {
            width: 600px;
            height: 600px;
            background: rgba(212, 175, 55, 0.1);
            bottom: -100px;
            right: -100px;
        }

        /* Top Section: The Book */
        .visual-section {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            z-index: 1;
            padding-bottom: 40px;
        }
        
        .book-container {
            position: relative;
        }

        .book-image {
            height: 700px;
            border-radius: 12px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8), -20px 0 40px rgba(0,0,0,0.5);
            transform: perspective(1000px) rotateY(-5deg) rotateX(2deg);
        }

        /* The "Prévente" Ribbon */
        .ribbon {
            position: absolute;
            top: 40px;
            right: -30px;
            background: linear-gradient(135deg, #FDE047, #D4AF37);
            color: #000;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.6rem;
            padding: 15px 40px;
            border-radius: 8px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            transform: rotate(10deg);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Bottom Section: Info */
        .info-section {
            flex: 0.8;
            position: relative;
            z-index: 1;
            padding: 0 80px 60px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .subtitle {
            color: #D4AF37;
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .main-title {
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 40px;
        }

        /* Price Box */
        .price-box {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 30px;
            padding: 40px;
            backdrop-filter: blur(20px);
            display: inline-block;
            margin: 0 auto;
            position: relative;
        }

        .price-box::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 32px;
            padding: 2px;
            background: linear-gradient(135deg, #D4AF37, transparent, #D4AF37);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.5;
        }

        .price-current {
            font-family: 'Outfit', sans-serif;
            font-size: 7rem;
            font-weight: 800;
            color: #fff;
            line-height: 1;
            background: linear-gradient(135deg, #FDE047, #D4AF37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            filter: drop-shadow(0 10px 20px rgba(212, 175, 55, 0.3));
        }

        .price-details {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-size: 1.8rem;
        }

        .price-old {
            color: #EF4444;
            font-weight: 700;
            text-decoration: line-through;
            opacity: 0.8;
        }

        .price-note {
            color: #94A3B8;
            font-weight: 500;
        }

        /* Footer */
        .footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 30px;
        }

        .bonuses {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #F8FAFC;
            font-size: 1.4rem;
            font-weight: 600;
        }

        .website {
            color: #D4AF37;
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
        }

    </style>
    <script src="../assets/js/site-language.js?v=4" defer></script>

    <!-- Shared HireMe favicon -->
    <link rel="icon" type="image/png" sizes="48x48" href="../assets/favicons/favicon-48.png?v=20261011">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicons/favicon-32.png?v=20261011">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicons/favicon-16.png?v=20261011">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicons/apple-touch-icon-180.png?v=20261011">
</head>
<body>

    <div class="flyer">
        <!-- Glow effects -->
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>

        <!-- Book Image Section -->
        <div class="visual-section">
            <div class="book-container">
                <img src="actual_ebook_cover.jpg" alt="Le Guide Premium" class="book-image">
                <div class="ribbon">PRÉVENTE</div>
            </div>
        </div>

        <!-- Typography & Pricing Section -->
        <div class="info-section">
            <div class="subtitle">Offre de Lancement Exclusive</div>
            <h1 class="main-title">Le Répertoire N°1 des<br>Recruteurs au Cameroun</h1>
            
            <div class="price-box">
                <div class="price-current">5 000 XAF</div>
                <div class="price-details">
                    <span class="price-note">au lieu de</span>
                    <span class="price-old">15 000 XAF</span>
                </div>
            </div>

            <div class="footer">
                <div class="bonuses">
                    <i data-lucide="gift" style="width: 32px; height: 32px; color: #D4AF37;"></i>
                    Livre numérique + 4 Bonus Inclus !
                </div>
                <div class="website">
                    moncvpro.hiremeguide.com/premium-ebook-page
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
