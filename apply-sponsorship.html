<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0WXT4Q08R2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-0WXT4Q08R2');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demander un Parrainage — HireMe</title>
    <link rel="icon" href="https://moncvpro.hiremeguide.com/assets/favicons/favicon-32.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        primary: '#0ea5e9',
                        accent: '#22c55e',
                        danger: '#ef4444',
                        neutral: '#111827',
                        bg: '#f8fafc'
                    }
                }
            }
        }
    </script>

    <style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body class="bg-bg text-neutral antialiased font-sans flex flex-col min-h-screen">

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 glass-effect border-b border-gray-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0">
                    <a href="index" class="text-2xl font-extrabold text-primary tracking-tight">HireMe</a>
                </div>
                <a href="sponsors"
                    class="text-gray-600 hover:text-primary transition-colors font-medium text-sm flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Page des Parrains
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
        <!-- Background Decor -->
        <div class="absolute top-0 left-0 w-full h-full -z-10 opacity-30">
            <div class="absolute top-10 right-10 w-64 h-64 bg-primary/20 rounded-full blur-3xl"></div>
            <div class="absolute bottom-10 left-10 w-96 h-96 bg-accent/10 rounded-full blur-3xl"></div>
        </div>

        <div class="max-w-xl w-full">
            <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
                <div class="bg-gradient-to-br from-primary to-blue-600 p-8 text-white relative">
                    <h1 class="text-2xl font-extrabold mb-2">Candidature au Parrainage</h1>
                    <p class="text-blue-50 text-sm opacity-90 leading-relaxed">
                        Expliquez-nous pourquoi vous avez besoin d'un CV professionnel. Nous vous mettrons en relation
                        avec un donateur généreux.
                    </p>
                    <div class="absolute -bottom-6 -right-6 w-24 h-24 bg-white/10 rounded-full blur-xl"></div>
                </div>

                <form id="applyForm" class="p-8 space-y-5" onsubmit="submitApplication(event)">
                    <div>
                        <label for="name" class="block text-sm font-semibold text-gray-700 mb-1">Votre Nom
                            Complet</label>
                        <input type="text" id="name" name="name" required placeholder="Ex: Jean Paul"
                            class="w-full rounded-xl border-gray-200 border p-3.5 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Email
                                (Optionnel)</label>
                            <input type="email" id="email" name="email" placeholder="email@exemple.com"
                                class="w-full rounded-xl border-gray-200 border p-3.5 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none">
                        </div>
                        <div>
                            <label for="whatsapp" class="block text-sm font-semibold text-gray-700 mb-1">WhatsApp <span
                                    class="text-danger">*</span></label>
                            <input type="tel" id="whatsapp" name="whatsapp" required placeholder="Ex: 6XXXXXXXX"
                                class="w-full rounded-xl border-gray-200 border p-3.5 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none">
                        </div>
                    </div>

                    <div>
                        <label for="motivation" class="block text-sm font-semibold text-gray-700 mb-1">Votre Histoire /
                            Motivation</label>
                        <textarea id="motivation" name="motivation" rows="4" required
                            placeholder="Racontez-nous votre situation actuelle et vos objectifs professionnels..."
                            class="w-full rounded-xl border-gray-200 border p-3.5 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none resize-none"></textarea>
                        <p class="text-[10px] text-gray-400 mt-2 italic flex items-center">
                            <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20">
                                <path
                                    d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z">
                                </path>
                            </svg>
                            Les parrains sont sensibles à la sincérité. Dites-nous tout !
                        </p>
                    </div>

                    <div class="pt-4">
                        <button type="submit" id="submitBtn"
                            class="w-full bg-accent text-white font-black py-4 rounded-2xl shadow-lg hover:bg-green-600 transition-all transform hover:scale-[1.02] flex justify-center items-center gap-2">
                            <span>Soumettre ma demande</span>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-8 text-center text-gray-400 text-xs">
        © 2026 HireMe. Programme d'inclusion professionnelle.
    </footer>

    <script>
        function submitApplication(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Envoi en cours...
            `;
            btn.disabled = true;

            const formData = new FormData(document.getElementById('applyForm'));

            fetch('api/save_sponsorship_request.php', {
                method: 'POST',
                body: formData
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.querySelector('#applyForm').innerHTML = `
                        <div class="text-center py-10 animate-bounce-slow">
                            <div class="w-20 h-20 bg-green-100 text-accent rounded-full flex items-center justify-center mx-auto mb-6">
                                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                </svg>
                            </div>
                            <h3 class="text-2xl font-black text-neutral mb-2">Demande Reçue !</h3>
                            <p class="text-gray-500 text-sm mb-8 px-6">Nous avons bien enregistré votre demande. Elle sera soumise à notre communauté de parrains. Restez attentif à votre WhatsApp !</p>
                            <a href="index" class="inline-flex items-center justify-center px-8 py-3 bg-primary text-white font-bold rounded-xl hover:bg-blue-600 transition-all">
                                Retour à l'accueil
                            </a>
                        </div>
                    `;
                    } else {
                        alert("Erreur: " + data.message);
                        btn.innerHTML = originalHtml;
                        btn.disabled = false;
                    }
                })
                .catch(err => {
                    alert("Erreur de connexion au serveur.");
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                });
        }
    </script>
</body>

</html>
